[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pol-pde-surrogate"
version = "0.2.29"
description = "Validated surrogate-dynamics feature maps for PDE operator learning"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pydantic>=2.7",
]

[project.scripts]
pol = "pol.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "build>=1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
